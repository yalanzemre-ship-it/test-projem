<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="cam.css">
<style>
  .ust-gradyan {
    background: linear-gradient(180deg,
      rgba(8, 34, 70, .55) 0%,
      rgba(8, 34, 70, .30) 22%,
      rgba(8, 34, 70, .08) 38%,
      rgba(8, 34, 70, 0) 46%);
  }
  .alt-gradyan {
    background: linear-gradient(0deg,
      rgba(6, 12, 8, .82) 0%,
      rgba(6, 12, 8, .60) 20%,
      rgba(6, 12, 8, .22) 30%,
      rgba(6, 12, 8, 0) 38%);
  }
  .logo { position: absolute; top: 190px; left: 50%; width: 380px; transform: translateX(-50%); }
  /* Kadran: 12 saatlik yüz, 10'dan 7'ye (19:00) yay */
  .kadran {
    position: absolute; top: 375px; left: 270px; width: 540px; height: 540px;
    border-radius: 50%;
    background: rgba(10, 24, 44, .34);
    border-color: rgba(255, 255, 255, .38);
  }
  .kadran svg { position: absolute; inset: 0; }
  .kadran .orta {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .kadran .orta .ne {
    font-size: 20px; font-weight: 600; letter-spacing: .4em; padding-left: .4em; color: var(--krem);
  }
  .kadran .orta .buyuk-saat { margin: 16px 0 22px; font-size: 58px; }
  .kadran .orta .not { font-size: 20px; gap: 14px; }
  .kadran .orta .not i { width: 11px; height: 11px; box-shadow: 0 0 0 5px rgba(94, 224, 138, .25); }
  .alt {
    position: absolute; left: 0; right: 0; bottom: 300px;
    display: flex; flex-direction: column; align-items: center;
  }
  .alt .baslik { font-size: 96px; }
  .alt .alt-baslik { margin-top: 22px; color: #fff; text-shadow: 0 2px 12px rgba(0, 0, 0, .4); }
</style>
</head>
<body>
<div class="story">
  <img class="foto" src="assets/foto-1-tam.png" width="1080" height="1920" alt="">
  <div class="katman ust-gradyan"></div>
  <div class="katman alt-gradyan"></div>

  <div class="logo"></div>

  <div class="cam kadran">
    <svg viewBox="0 0 540 540" width="540" height="540">
      <defs>
        <linearGradient id="yay" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6efe2"/>
          <stop offset="1" stop-color="#d9c39b"/>
        </linearGradient>
        <filter id="parilti" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="tikler"></g>
      <circle cx="270" cy="270" r="222" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14"/>
      <!-- 10 (300°) -> 7 (210°), saat yönünde 270° -->
      <path d="M 77.74 159 A 222 222 0 1 1 159 462.26" fill="none" stroke="url(#yay)" stroke-width="14" stroke-linecap="round" filter="url(#parilti)"/>
      <circle cx="77.74" cy="159" r="13" fill="#fff"/>
      <circle cx="159" cy="462.26" r="13" fill="#fff"/>
    </svg>
    <div class="orta">
      <div class="ne">HER GÜN</div>
      <div class="buyuk-saat">10<span class="iki-nokta">:</span>00<span class="tire"></span>19<span class="iki-nokta">:</span>00</div>
      <div class="not"><i></i>AÇIĞIZ</div>
    </div>
  </div>

  <div class="alt">
    <div class="baslik">Çalışma Saatleri</div>
    <div class="alt-baslik">PAZARTESİ – PAZAR</div>
  </div>
</div>
<script>
  // 60 dakika çizgisi; saat başları daha uzun ve parlak
  const g = document.getElementById("tikler");
  for (let i = 0; i < 60; i++) {
    const saat = i % 5 === 0;
    const a = (i * 6) * Math.PI / 180;
    const r1 = saat ? 244 : 250, r2 = 258;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", 270 + r1 * Math.sin(a)); l.setAttribute("y1", 270 - r1 * Math.cos(a));
    l.setAttribute("x2", 270 + r2 * Math.sin(a)); l.setAttribute("y2", 270 - r2 * Math.cos(a));
    l.setAttribute("stroke", saat ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.3)");
    l.setAttribute("stroke-width", saat ? 3 : 1.5);
    l.setAttribute("stroke-linecap", "round");
    g.appendChild(l);
  }
</script>
</body>
</html>
