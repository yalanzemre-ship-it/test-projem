<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="cam.css">
<style>
  .karartma {
    background: linear-gradient(180deg,
      rgba(14, 11, 9, .70) 0%,
      rgba(14, 11, 9, .34) 20%,
      rgba(14, 11, 9, .26) 55%,
      rgba(14, 11, 9, .60) 100%);
  }
  .ust {
    position: absolute; top: 210px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo { width: 430px; }
  .baslik { margin-top: 58px; }
  .alt-baslik { margin-top: 18px; }
  .kart {
    position: absolute; top: 760px; left: 100px; width: 880px;
    padding: 58px 56px 56px;
  }
  .kart .ne {
    display: flex; justify-content: space-around;
    font-size: 22px; font-weight: 600; letter-spacing: .38em; padding-left: .38em;
    color: rgba(255, 255, 255, .72);
  }
  .kart .buyuk-saat { margin-top: 18px; font-size: 118px; }
  .kart .cizgi { margin: 46px 0 40px; height: 1.5px; background: rgba(255, 255, 255, .16); }
  .alt-not { position: absolute; top: 1312px; left: 0; right: 0; display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="story">
  <img class="foto" src="assets/foto-3-tam.png" width="1080" height="1920" alt="">
  <div class="katman karartma"></div>

  <div class="ust">
    <div class="logo"></div>
    <div class="baslik">Çalışma Saatleri</div>
    <div class="alt-baslik">PAZARTESİ – PAZAR</div>
  </div>

  <div class="cam kart">
    <div class="ne"><span>AÇILIŞ</span><span>KAPANIŞ</span></div>
    <div class="buyuk-saat">10<span class="iki-nokta">:</span>00<span class="tire"></span>19<span class="iki-nokta">:</span>00</div>
    <div class="cizgi"></div>
    <div class="gunler">
      <span>Pzt<i class="acik"></i></span>
      <span>Sal<i class="acik"></i></span>
      <span>Çar<i class="acik"></i></span>
      <span>Per<i class="acik"></i></span>
      <span>Cum<i class="acik"></i></span>
      <span>Cmt<i class="acik"></i></span>
      <span>Paz<i class="acik"></i></span>
    </div>
  </div>

  <div class="alt-not"><div class="not"><i></i>HAFTANIN HER GÜNÜ AÇIĞIZ</div></div>
</div>
</body>
</html>
